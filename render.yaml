services:
  - type: web
    name: coffee-shop-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: false
      - key: ALLOWED_ORIGINS
        sync: false   # set manually in Render dashboard to your Vercel URL
      - key: NIM_API_KEY
        sync: false
      - key: NIM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: SMALL_LLM_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_TIMEOUT_SECONDS
        value: "60"
      - key: HF_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: coffee-products
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGSMITH_TRACING_V2
        value: "false"
